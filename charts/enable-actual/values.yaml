nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: 2manyvcos/enable-actual
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sync.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  PUBLIC_URL: ""
  SSL_ENABLED: "false"
  LOG_LEVEL: info

actualServerUrl: ""

resources: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi


