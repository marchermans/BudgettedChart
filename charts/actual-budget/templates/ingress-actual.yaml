{{- if .Values.actual.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "actual-budget.actualServiceName" . }}
  labels:
    {{- include "actual-budget.labels" . | nindent 4 }}
    app.kubernetes.io/component: actual
  {{- with .Values.actual.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.actual.ingress.className }}
  ingressClassName: {{ .Values.actual.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.actual.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "actual-budget.actualServiceName" $ }}
                port:
                  number: {{ $.Values.actual.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.actual.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

