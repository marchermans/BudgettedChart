name: Helm Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Compute chart version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [[ -n "${latest_tag}" ]]; then
            base="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${base}"
            commits_since=$(git rev-list "${latest_tag}..HEAD" --count)
            new_patch=$((patch + commits_since))
            chart_version="${major}.${minor}.${new_patch}"
          else
            commits_since=$(git rev-list HEAD --count)
            chart_version="0.0.${commits_since}"
          fi

          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Apply computed version to charts
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          python3 .github/scripts/set_chart_version.py "${CHART_VERSION}"

      - name: Update parent dependencies
        run: helm dependency update charts/actual-budget

      - name: Lint enable-actual chart
        run: helm lint charts/enable-actual

      - name: Lint chart
        run: helm lint charts/actual-budget

      - name: Package charts
        run: |
          mkdir -p .cr-release-packages
          helm package charts/enable-actual --destination .cr-release-packages
          helm package charts/actual-budget --destination .cr-release-packages

      - name: Ensure gh-pages branch exists
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists"
            exit 0
          fi

          echo "Creating orphan gh-pages branch"
          current_branch=$(git branch --show-current)
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: initialize gh-pages"
          git push origin gh-pages
          git checkout "${current_branch}"

      - name: Configure git for chart-releaser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish chart index to GitHub Pages
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true

      - name: Login to GHCR
        run: |
          owner="${{ github.repository_owner }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${owner}" --password-stdin

      - name: Push charts to GHCR (OCI)
        run: |
          actual_budget_version=$(awk '/^version:/{print $2}' charts/actual-budget/Chart.yaml)
          enable_actual_version=$(awk '/^version:/{print $2}' charts/enable-actual/Chart.yaml)
          owner="${{ github.repository_owner }}"
          owner="${owner,,}"
          helm push ".cr-release-packages/enable-actual-${enable_actual_version}.tgz" "oci://ghcr.io/${owner}/charts"
          helm push ".cr-release-packages/actual-budget-${actual_budget_version}.tgz" "oci://ghcr.io/${owner}/charts"

